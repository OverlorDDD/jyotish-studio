name: Google Brand and Favicon
on:
  push:
    branches: [fix/google-brand-favicon-root-discovery-20261101]
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://galaxiora.example
      SITE_NOINDEX: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Brand site and favicon source contracts
        run: |
          node --test tools/google-brand-visibility.test.mjs
          node --test tools/brand-favicon.test.mjs
          npm run test:seo
          npm run test:r32:seo
      - name: Next.js build
        run: npm run build
