name: Google Brand and Favicon
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/brand-assets/**'
      - 'apps/web/app/layout.tsx'
      - 'apps/web/app/page.tsx'
      - 'apps/web/next.config.mjs'
      - 'tools/google-favicon-production-audit.mjs'
      - 'apps/web/app/components/PortalShell.tsx'
      - 'tools/brand-icons-build.mjs'
      - 'tools/brand-icons.test.mjs'
      - 'tools/brand-favicon.test.mjs'
      - 'tools/google-brand-visibility.test.mjs'
      - 'e2e/galaxiora-favicon.spec.mjs'
      - '.github/workflows/google-brand-visibility.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/brand-assets/**'
      - 'apps/web/app/layout.tsx'
      - 'apps/web/app/page.tsx'
      - 'apps/web/next.config.mjs'
      - 'tools/google-favicon-production-audit.mjs'
      - 'apps/web/app/components/PortalShell.tsx'
      - 'tools/brand-icons-build.mjs'
      - 'tools/brand-icons.test.mjs'
      - 'tools/brand-favicon.test.mjs'
      - 'tools/google-brand-visibility.test.mjs'
      - 'e2e/galaxiora-favicon.spec.mjs'
      - '.github/workflows/google-brand-visibility.yml'
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://galaxiora.example
      SITE_NOINDEX: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Generate approved spiral #6 icons before tests
        run: npm run brand:icons:build
      - name: Verify original artwork, Google favicon, browser and mobile variants
        run: |
          node --test tools/brand-icons.test.mjs tools/brand-favicon.test.mjs tools/google-brand-visibility.test.mjs
          npm run test:seo
          npm run test:r32:seo
      - name: Production build
        run: |
          node --check tools/google-favicon-production-audit.mjs
          npm run build
      - name: Independently verify served PNG / ICO / Next icons and Googlebot-Image
        run: |
          (cd apps/web && node ../../node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000) >/tmp/brand-next.log 2>&1 &
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ -o /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/brand-next.log; exit 1; fi
          node tools/google-favicon-production-audit.mjs http://127.0.0.1:3000
