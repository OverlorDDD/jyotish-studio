name: GalaxiPedia Academy preservation and SEO migration
on:
  push:
    branches:
      - feat/galaxipedia-unified-20261104
      - feat/galaxipedia-search-first-ux-20261104
      - feat/galaxipedia-search-first-approved-20261104
  pull_request:
    branches:
      - release/growth1-preserve-live-ga4-20261104
      - feat/galaxipedia-unified-20261104
      - feat/galaxipedia-seo-topical-clusters-20261104
    paths:
      - 'apps/web/app/**'
      - 'apps/web/lib/**'
      - 'apps/web/next.config.mjs'
      - 'e2e/galaxipedia.spec.mjs'
      - 'e2e/a5-yoga-academy.spec.mjs'
      - 'e2e/a6-editorial.spec.mjs'
      - 'e2e/a4-portal.spec.mjs'
      - 'tools/galaxipedia.test.mjs'
      - 'tools/galaxipedia-seo.test.mjs'
      - 'tools/galaxipedia-layout.test.mjs'
      - 'package.json'
      - '.github/workflows/galaxipedia-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: galaxipedia-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    env:
      SITE_NOINDEX: '0'
      NEXT_PUBLIC_SITE_URL: https://galaxiora.example
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5433/galaxiora_a1_test
      AUTH_SECRET: pedia-ci-only-never-deploy
      AI_MODE: local
      TAROT_AI_ENABLED: 'false'
      ALLOW_PYTHON_SWISSEPH: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyswisseph
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
      - name: GalaxiPedia and original Academy contracts
        run: |
          npm run test:pedia
          npm run test:content:a5
          npm run test:growth1:seo
          npm run test:r32:seo
      - name: Production build with approved icon ancestry
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: galaxiora_a1_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ci -d galaxiora_a1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      GALAXIORA_E2E_TEST_AUTH: '1'
      SITE_NOINDEX: '0'
      NEXT_PUBLIC_SITE_URL: https://galaxiora.example
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5433/galaxiora_a1_test?schema=public
      AUTH_SECRET: pedia-browser-ci-only-never-deploy
      AI_MODE: local
      TAROT_AI_ENABLED: 'false'
      ALLOW_PYTHON_SWISSEPH: '1'
      WEB_PORT: '3000'
      PORT: '4000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies and disposable DB
        run: |
          npm install --no-audit --no-fund
          python -m pip install pyswisseph
          npm run db:generate
          npm run db:migrate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start isolated API and Next.js
        run: |
          printf 'DATABASE_URL=%s\nAUTH_SECRET=%s\nAI_MODE=local\nSITE_NOINDEX=0\nNEXT_PUBLIC_SITE_URL=https://galaxiora.example\n' "$DATABASE_URL" "$AUTH_SECRET" > .env
          npm run start:full > /tmp/galaxipedia-browser.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/en/pedia > /dev/null &&
               curl -fsS http://127.0.0.1:4000/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/galaxipedia-browser.log
          exit 1
      - name: Desktop and mobile migration regression
        run: npx playwright test e2e/galaxipedia.spec.mjs e2e/a5-yoga-academy.spec.mjs e2e/a6-editorial.spec.mjs e2e/a4-portal.spec.mjs
      - name: Debug web or API errors on failure
        if: failure()
        run: tail -200 /tmp/galaxipedia-browser.log || true
