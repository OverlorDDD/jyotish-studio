name: Panchanga P3.5 Focused Browser Acceptance
on:
  push:
    branches:
      - feat/panchanga-p35-personal-calendar-7-30-20261102
  pull_request:
    paths:
      - 'apps/api/src/panchanga-personal-calendar.ts'
      - 'apps/api/src/personal.ts'
      - 'apps/web/lib/panchanga-p35-calendar.ts'
      - 'apps/web/app/components/PanchangaPersonalCalendar*'
      - 'e2e/panchanga-p35.spec.mjs'
jobs:
  calendar-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: galaxiora_a1_test
        ports: [ '5433:5432' ]
        options: >-
          --health-cmd "pg_isready -U ci -d galaxiora_a1_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: 'true'
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5433/galaxiora_a1_test
      AUTH_SECRET: p35-disposable-ci-only-not-production-2026
      SITE_NOINDEX: '1'
      NEWS_INGESTION_ENABLED: '0'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      INTERNAL_API_ORIGIN: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install app and Swiss reference
        run: |
          npm ci --no-audit --no-fund
          python -m pip install pyswisseph
      - name: Prepare disposable database
        run: |
          npm run db:generate
          npm run db:migrate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start isolated API and Next web
        run: |
          printf '%s\n' \
            'DATABASE_URL=postgresql://ci:ci@127.0.0.1:5433/galaxiora_a1_test' \
            'AUTH_SECRET=p35-disposable-ci-only-not-production-2026' \
            'SITE_NOINDEX=1' \
            'NEWS_INGESTION_ENABLED=0' \
            'NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000' \
            'INTERNAL_API_ORIGIN=http://127.0.0.1:4000' > .env
          npm run start -w @jyotish/api > /tmp/p35-api.log 2>&1 &
          npm run dev -w @jyotish/web > /tmp/p35-web.log 2>&1 &
          node --input-type=module -e 'let ok=false;for(let i=0;i<180;i++){try{const r=await fetch("http://127.0.0.1:3000/uk/panchanga");if(r.ok){ok=true;break;}}catch{}await new Promise(resolve=>setTimeout(resolve,1000));}if(!ok)process.exit(1);'
      - name: P3.5 signed-in / guest desktop and 320px mobile
        run: npx playwright test e2e/panchanga-p35.spec.mjs --config=playwright.config.mjs --project=desktop-chromium --project=mobile-chromium
      - name: Print service failures
        if: failure()
        run: |
          tail -n 80 /tmp/p35-api.log || true
          tail -n 80 /tmp/p35-web.log || true
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: panchanga-p35-e2e-traces
          path: test-results/
          retention-days: 3
