name: N4.13 Native SWIEPH strict backend smoke
on:
  push:
    branches: [feat/n4-shodashavarga-foundation]
    paths:
      - 'tools/n4-native-swieph-exact-profile.mjs'
      - 'tools/n4-native-swieph-exact-profile.test.mjs'
      - 'tools/n4-original-jhora50-reference-gate.mjs'
      - '.github/workflows/n4-13-native-swieph.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n413-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-swieph:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: '22'
          - os: windows-latest
            node: '24'
    name: Native SWIEPH ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - name: N4.13 private Windows launcher full PowerShell 5.1 parse (never execute)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $source = 'tools/n4-13-private-run.ps1'
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $source).Path)
          if (@($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) { throw 'N413_NON_ASCII_POWERSHELL' }
          $tokens = $null
          $errorsFound = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $source).Path,[ref]$tokens,[ref]$errorsFound)
          if (@($errorsFound).Count -gt 0) { $errorsFound | ForEach-Object { Write-Host $_.Message }; throw 'N413_WINDOWS_PS51_PARSE_FAILED' }
          Write-Host 'N413_WINDOWS_PS51_PRIVATE_LAUNCHER_PARSE_PASS'
      - name: N4.13 strict negative and shape tests
        run: node --experimental-strip-types --test tools/n4-native-swieph-exact-profile.test.mjs tools/n4-original-jhora50-reference-gate.test.mjs
      - name: Native SWIEPH files and actual return-flags smoke (NOT 50-case certification)
        run: npm run n4:13:smoke
      - name: Assert no original private JHora sources in checked-in tree
        shell: bash
        run: |
          if git ls-files | grep -E 'N4_12_50_ORIGINAL_JHORA_SANITIZED_REFERENCE_PRIVATE|N4-12-ORIGINAL-JHORA8-002-050-MAIN-ASCII|N4-SYNTH-001-ORIGINAL-JHORA-PILOT'; then
            echo 'Private original JHora sources must not be committed'; exit 1
          fi
          echo N413_NO_PRIVATE_REFERENCE_COMMITTED_PASS
