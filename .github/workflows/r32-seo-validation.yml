name: R3.2 SEO Validation
on:
  push:
    branches: [fix/r32-search-brand-and-sitemap-20261101]
  workflow_dispatch:
jobs:
  seo:
    name: R3.2 canonical SEO, brand assets and production build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5433/ci
      SITE_NOINDEX: '0'
      NEXT_PUBLIC_SITE_URL: https://galaxiora.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma Client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Install Swiss Ephemeris fallback
        run: python -m pip install pyswisseph
      - name: SEO existing contract
        run: npm run test:seo
      - name: R3.2 SEO regression
        run: npm run test:r32:seo
      - name: Production build
        run: npm run build
