name: N4.14 historical time and D60 boundary diagnostics
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/n4-14-time-d60.yml'
      - 'tools/n4-14-time-d60.mjs'
      - 'tools/n4-14-time-d60.test.mjs'
      - 'tools/n4-14-regression-corpus.test.mjs'
      - 'tools/n4-14-sensitivity.mjs'
      - 'tools/n4-14-sensitivity.test.mjs'
      - 'tools/n4-14-utc-sensitivity.test.mjs'
      - 'tools/n4-14-python-zoneinfo.py'
      - 'tools/n4-14-python-requirements.txt'
      - 'tools/n4-14-crossing-refinement.mjs'
      - 'tools/n4-14-crossing-refinement.test.mjs'
      - 'tools/n4-14-report-gate.mjs'
      - 'tools/n4-14-report-gate.test.mjs'
      - 'tools/n4-14-transition-fixtures.json'
      - 'tools/n4-14-transition-fixtures.test.mjs'
      - 'tools/n4-14-historical-source-ledger.json'
      - 'tools/n4-14-historical-source-ledger.test.mjs'
      - 'tools/n4-14-native-private-run.mjs'
      - 'tools/n4-d2-original-profile-crosswalk.mjs'
      - 'tools/n4-d2-original-profile-crosswalk.test.mjs'
      - 'tools/n4-production-utc-transition-parity.test.mjs'
      - 'tools/n4-vimshottari-year-mode-audit.mjs'
      - 'tools/n4-vimshottari-year-mode-audit.test.mjs'
      - 'tools/n4-math-integration-readiness.mjs'
      - 'tools/n4-math-integration-readiness.test.mjs'
      - 'tools/n4-math-phase2-verify.ps1'
      - 'packages/jyotish-core/src/index.ts'
      - 'packages/jyotish-core/src/varga-method-profiles.ts'
      - 'tools/n4-exact-production-varga-methods.test.mjs'
      - 'tools/n4-original50-explicit-profile-gate.mjs'
      - 'tools/n4-original50-explicit-profile-gate.test.mjs'
      - 'tools/n4-jhora20-dasha-date-audit.mjs'
      - 'tools/n4-jhora20-dasha-date-audit.test.mjs'
      - 'tools/n4-historical-birth-confidence.mjs'
      - 'tools/n4-historical-birth-confidence.test.mjs'
      - 'tools/n4-14-verify.ps1'
      - 'tools/n4-native-swieph-exact-profile.mjs'
      - 'apps/api/src/n4-birth-time-certainty.ts'
      - 'tools/n4-birth-time-policy.test.mjs'
  push:
    branches: [feat/n4-shodashavarga-foundation]
    paths:
      - '.github/workflows/n4-14-time-d60.yml'
      - 'tools/n4-14-time-d60.mjs'
      - 'tools/n4-14-time-d60.test.mjs'
      - 'tools/n4-14-regression-corpus.test.mjs'
      - 'tools/n4-14-sensitivity.mjs'
      - 'tools/n4-14-sensitivity.test.mjs'
      - 'tools/n4-14-utc-sensitivity.test.mjs'
      - 'tools/n4-14-python-zoneinfo.py'
      - 'tools/n4-14-python-requirements.txt'
      - 'tools/n4-14-crossing-refinement.mjs'
      - 'tools/n4-14-crossing-refinement.test.mjs'
      - 'tools/n4-14-report-gate.mjs'
      - 'tools/n4-14-report-gate.test.mjs'
      - 'tools/n4-14-transition-fixtures.json'
      - 'tools/n4-14-transition-fixtures.test.mjs'
      - 'tools/n4-14-historical-source-ledger.json'
      - 'tools/n4-14-historical-source-ledger.test.mjs'
      - 'tools/n4-14-native-private-run.mjs'
      - 'tools/n4-d2-original-profile-crosswalk.mjs'
      - 'tools/n4-d2-original-profile-crosswalk.test.mjs'
      - 'tools/n4-production-utc-transition-parity.test.mjs'
      - 'tools/n4-vimshottari-year-mode-audit.mjs'
      - 'tools/n4-vimshottari-year-mode-audit.test.mjs'
      - 'tools/n4-math-integration-readiness.mjs'
      - 'tools/n4-math-integration-readiness.test.mjs'
      - 'tools/n4-math-phase2-verify.ps1'
      - 'packages/jyotish-core/src/index.ts'
      - 'packages/jyotish-core/src/varga-method-profiles.ts'
      - 'tools/n4-exact-production-varga-methods.test.mjs'
      - 'tools/n4-original50-explicit-profile-gate.mjs'
      - 'tools/n4-original50-explicit-profile-gate.test.mjs'
      - 'tools/n4-jhora20-dasha-date-audit.mjs'
      - 'tools/n4-jhora20-dasha-date-audit.test.mjs'
      - 'tools/n4-historical-birth-confidence.mjs'
      - 'tools/n4-historical-birth-confidence.test.mjs'
      - 'tools/n4-14-verify.ps1'
      - 'tools/n4-native-swieph-exact-profile.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n414-${{ github.ref }}
  cancel-in-progress: true
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Python IANA timezone dataset
        run: python -m pip install --disable-pip-version-check -r tools/n4-14-python-requirements.txt
      - name: Record Node ICU and tzdb versions
        run: node -e "console.log(JSON.stringify({node:process.version,icu:process.versions.icu,tz:process.versions.tz},null,2))"
      - name: Validate native research adapter and audit CLI syntax
        run: node --check tools/n4-14-native-private-run.mjs && node --check tools/n4-native-swieph-exact-profile.mjs && node --check tools/n4-14-crossing-refinement.mjs && node --check tools/n4-14-report-gate.mjs
      - name: N4.14 fail-closed JS mathematical and civil-time regressions
        run: node --experimental-strip-types --test tools/n4-14-time-d60.test.mjs tools/n4-14-regression-corpus.test.mjs tools/n4-14-sensitivity.test.mjs tools/n4-14-utc-sensitivity.test.mjs tools/n4-14-crossing-refinement.test.mjs tools/n4-14-report-gate.test.mjs tools/n4-14-transition-fixtures.test.mjs tools/n4-14-historical-source-ledger.test.mjs tools/n4-d2-original-profile-crosswalk.test.mjs tools/n4-production-utc-transition-parity.test.mjs tools/n4-vimshottari-year-mode-audit.test.mjs tools/n4-math-integration-readiness.test.mjs tools/n4-exact-production-varga-methods.test.mjs tools/n4-original50-explicit-profile-gate.test.mjs tools/n4-jhora20-dasha-date-audit.test.mjs tools/n4-historical-birth-confidence.test.mjs
      - name: Syntax-check Windows one-shot verifier without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/n4-14-verify.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/n4-math-phase2-verify.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Pinned Python zoneinfo cross-runtime differential
        run: python tools/n4-14-python-zoneinfo.py
      - name: Diagnostic only; NO private source and NO production certificate
        run: |
          echo N414_PUBLIC_DIAGNOSTIC_CI_PASS
          echo N414_HISTORICAL_TIME_AND_D60_CERTAINTY_PASS_NOT_ISSUED
