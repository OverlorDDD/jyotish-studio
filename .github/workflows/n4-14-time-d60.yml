  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n414-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-worktree-path-regression:
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Windows Git vs PowerShell linked-worktree path validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = Join-Path $env:RUNNER_TEMP 'n417-path-fixture-repo'
          $linked = Join-Path $env:RUNNER_TEMP 'n417-path-fixture-linked'
          & git init -q $repo
          if ($LASTEXITCODE -ne 0) { throw 'N417_TEST_GIT_INIT_FAILED' }
          Set-Content -LiteralPath (Join-Path $repo 'fixture.txt') -Value 'synthetic'
          & git -C $repo add fixture.txt
          if ($LASTEXITCODE -ne 0) { throw 'N417_TEST_GIT_ADD_FAILED' }
          & git -C $repo -c user.name=N4-Path-Test -c user.email=n4@example.invalid commit -qm fixture
          if ($LASTEXITCODE -ne 0) { throw 'N417_TEST_GIT_COMMIT_FAILED' }
          & git -C $repo worktree add --detach $linked HEAD
          if ($LASTEXITCODE -ne 0) { throw 'N417_TEST_WORKTREE_CREATE_FAILED' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/n4-17-one-date-forensics.ps1 -ReferenceWorktree $linked -ValidateWorktreeOnly
          if ($LASTEXITCODE -ne 0) { throw 'N417_TEST_VALID_LINKED_WORKTREE_REJECTED' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/n4-17-one-date-forensics.ps1 -ReferenceWorktree $repo -ValidateWorktreeOnly
          if ($LASTEXITCODE -eq 0) { throw 'N417_TEST_ORDINARY_GIT_REPO_FALSELY_ACCEPTED' }
          $nested = Join-Path $linked 'nested'
          New-Item -ItemType Directory -Path $nested | Out-Null
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/n4-17-one-date-forensics.ps1 -ReferenceWorktree $nested -ValidateWorktreeOnly
          if ($LASTEXITCODE -eq 0) { throw 'N417_TEST_NESTED_FOLDER_FALSELY_ACCEPTED' }
          Write-Host 'N417_WINDOWS_REAL_GIT_WORKTREE_PATH_REGRESSION_PASS'
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Python IANA timezone dataset
        run: python -m pip install --disable-pip-version-check -r tools/n4-14-python-requirements.txt
      - name: Record Node ICU and tzdb versions
        run: node -e "console.log(JSON.stringify({node:process.version,icu:process.versions.icu,tz:process.versions.tz},null,2))"
      - name: Validate native research adapter and audit CLI syntax
        run: node --check tools/n4-14-native-private-run.mjs && node --check tools/n4-native-swieph-exact-profile.mjs && node --check tools/n4-14-crossing-refinement.mjs && node --check tools/n4-14-report-gate.mjs
      - name: N4.14 fail-closed JS mathematical and civil-time regressions
        run: node --experimental-strip-types --test tools/n4-14-time-d60.test.mjs tools/n4-14-regression-corpus.test.mjs tools/n4-14-sensitivity.test.mjs tools/n4-14-utc-sensitivity.test.mjs tools/n4-14-crossing-refinement.test.mjs tools/n4-14-report-gate.test.mjs tools/n4-14-transition-fixtures.test.mjs tools/n4-14-historical-source-ledger.test.mjs tools/n4-d2-original-profile-crosswalk.test.mjs tools/n4-production-utc-transition-parity.test.mjs tools/n4-vimshottari-year-mode-audit.test.mjs tools/n4-math-integration-readiness.test.mjs tools/n4-exact-production-varga-methods.test.mjs tools/n4-original50-explicit-profile-gate.test.mjs tools/n4-jhora20-dasha-date-audit.test.mjs tools/n4-historical-birth-confidence.test.mjs tools/n4-dasha-year-mode-matrix.test.mjs tools/n4-dasha-true-solar-native.test.mjs tools/n4-math-scope-ledger.test.mjs
      - name: Syntax-check Windows one-shot verifier without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/n4-14-verify.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/n4-math-phase2-verify.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/n4-17-one-date-forensics.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Pinned Python zoneinfo cross-runtime differential
        run: python tools/n4-14-python-zoneinfo.py
      - name: Diagnostic only; NO private source and NO production certificate
        run: |
          echo N414_PUBLIC_DIAGNOSTIC_CI_PASS
          echo N414_HISTORICAL_TIME_AND_D60_CERTAINTY_PASS_NOT_ISSUED
