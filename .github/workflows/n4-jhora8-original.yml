name: N4 Original Jagannatha Hora 8.0 — 50-profile parity
on:
  push:
    branches: [test/n4-jhora8-official-full-20261104]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/n4-jhora8-original.yml'
      - 'tools/n4-jhora8-batch.mjs'
      - 'tools/n4-jhora8-run.sh'
      - 'tools/n4-jhorakit-import.mjs'
      - 'tools/n4-external-varga-gate.mjs'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-jhora8-provenance:
    name: 50 genuine JHora 8.0 captures, 8000 same-method sign comparisons
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      WINEDEBUG: '-all'
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Publisher-owned JHora 8.0 ZIP preflight (fail fast before Wine install)
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/n4-jhora8-publisher.zip"
          for package in jh_short_install.zip jh_full_install.zip; do
            for host in 'https://www.vedicastrologer.org/jh' 'https://mail.vedicastrologer.org/jh' 'https://vedicastrologer.org/jh'; do
              echo "N4_OFFICIAL_PREFLIGHT_TRY $host/$package"
              if curl -fsSL --retry 1 --connect-timeout 15 --max-time 300 \
                  "$host/$package" -o "$archive" &&
                 unzip -t "$archive" >/dev/null &&
                 unzip -Z1 "$archive" | grep -Eiq '(^|/|\\)(jh_short_install|jh_full_install)\\.exe$'; then
                echo "N4_GENUINE_JHORA8_OFFICIAL_ZIP_AVAILABLE $host/$package"
                sha256sum "$archive"
                exit 0
              fi
            done
          done
          echo '::error title=Original JHora 8.0 blocked::No valid author-owned short or full JHora ZIP could be retrieved; not certified'
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'
      - name: Install disposable i386 Wine and virtual display for authentic JHora Win32 GUI
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine wine32:i386 wine64 xvfb xauth unzip curl ca-certificates git
          wine --version
          swift --version
      - name: Capture 50 authentic original JHora 8.0 outputs, import and compare
        shell: bash
        run: xvfb-run -a -s "-screen 0 1440x900x24" bash tools/n4-jhora8-run.sh
      - name: Retain ONLY sanitized synthetic evidence (no EXE, user data or raw clipboard)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n4-original-jhora8-synthetic-sanitized
          path: ${{ runner.temp }}/n4-jhora8-sanitized.json
          if-no-files-found: ignore
          retention-days: 7
