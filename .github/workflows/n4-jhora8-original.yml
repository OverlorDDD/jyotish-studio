name: N4 Original Jagannatha Hora 8.0 — 50-profile parity
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/n4-jhora8-original.yml'
      - 'tools/n4-jhora8-batch.mjs'
      - 'tools/n4-jhora8-run.sh'
      - 'tools/n4-jhorakit-import.mjs'
      - 'tools/n4-external-varga-gate.mjs'
  workflow_dispatch:
jobs:
  original-jhora8-provenance:
    name: 50 genuine JHora 8.0 captures, 8000 same-method sign comparisons
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      WINEDEBUG: '-all'
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'
      - name: Install disposable i386 Wine and virtual display for authentic JHora Win32 GUI
        shell: bash
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine wine32:i386 wine64 xvfb xauth unzip curl ca-certificates git
          wine --version
          swift --version
      - name: Capture 50 authentic original JHora 8.0 outputs, import and compare
        shell: bash
        run: xvfb-run -a -s "-screen 0 1440x900x24" bash tools/n4-jhora8-run.sh
      - name: Retain ONLY sanitized synthetic evidence (no EXE, user data or raw clipboard)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n4-original-jhora8-synthetic-sanitized
          path: ${{ runner.temp }}/n4-jhora8-sanitized.json
          if-no-files-found: ignore
          retention-days: 7
