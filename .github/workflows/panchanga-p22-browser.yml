name: Panchanga P2.1–P3.1 Browser Integration
on:
  push:
    branches:
      - feat/panchanga-v2-p22-live-day-20261102
      - feat/panchanga-v2-p23-smart-calendar-20261102
      - feat/panchanga-v2-p24-unified-hub-20261102
      - release/panchanga-v2-p25-integrated-20261102
      - feat/panchanga-p31-my-day-ux-20261102
  pull_request:
    paths:
      - 'apps/web/app/components/Panchanga*'
      - 'apps/web/lib/panchanga-*'
      - 'packages/jyotish-core/src/panchanga.ts'
      - 'apps/api/src/panchanga*'
      - 'e2e/panchanga*'
      - 'apps/api/src/vedic-calendar*'
      - 'packages/jyotish-core/src/lunar-phase-calendar.ts'
jobs:
  panchanga-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      CI: '1'
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5433/ci
      AUTH_SECRET: panchanga-v2-ci-only-synthetic-secret-2026
      SITE_NOINDEX: '1'
      NEWS_INGESTION_ENABLED: '0'
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      INTERNAL_API_ORIGIN: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and Swiss rise/set dependencies
        run: |
          npm install --no-audit --no-fund
          python -m pip install pyswisseph
      - name: Generate database client and apply additive migrations to isolated CI PostgreSQL
        run: |
          npm run db:generate
          npm run db:migrate
      - name: Install Playwright Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Create synthetic local-only runtime configuration
        run: |
          printf '%s\n' \
            'DATABASE_URL=postgresql://ci:ci@127.0.0.1:5433/ci' \
            'AUTH_SECRET=panchanga-v2-ci-only-synthetic-secret-2026' \
            'SITE_NOINDEX=1' \
            'NEWS_INGESTION_ENABLED=0' \
            'NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000' \
            'INTERNAL_API_ORIGIN=http://127.0.0.1:4000' > .env
      - name: Start NestJS API and Next.js on loopback only
        run: |
          npm run start -w @jyotish/api > /tmp/panchanga-api.log 2>&1 &
          npm run dev -w @jyotish/web > /tmp/panchanga-web.log 2>&1 &
          node --input-type=module -e 'let ok=false; for(let i=0;i<180;i++){try{const r=await fetch("http://127.0.0.1:3000/uk/panchanga");if(r.ok){ok=true;break}}catch{} await new Promise(resolve=>setTimeout(resolve,1000));} if(!ok)process.exit(1);'
      - name: Exercise day/range/live named timeline in desktop and phone Chromium
        run: npx playwright test e2e/panchanga.spec.mjs e2e/panchanga-v2.spec.mjs e2e/panchanga-p22.spec.mjs e2e/panchanga-p23.spec.mjs e2e/panchanga-p24.spec.mjs e2e/panchanga-p25.spec.mjs e2e/panchanga-p31.spec.mjs --config=playwright.config.mjs --project=desktop-chromium --project=mobile-chromium
      - name: Print development server logs if browser checks fail
        if: failure()
        run: |
          tail -n 140 /tmp/panchanga-api.log || true
          tail -n 140 /tmp/panchanga-web.log || true
      - name: Upload failing browser traces without secrets
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: panchanga-p22-e2e-traces
          path: test-results/
          retention-days: 3
