name: N4 Independent PyJHora 16-Varga Parity
on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/jyotish-core/src/vargas.ts'
      - 'tools/n4-pyjhora-oracle.py'
      - 'tools/n4-pyjhora-compare.mjs'
      - 'tools/n4-jhora-public-sample.test.mjs'
      - '.github/workflows/n4-independent-parity.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  n4-integrated-regression:
    name: N4 internal + personal + SEO + AI safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install repository dependencies
        run: npm ci --no-audit --no-fund
      - name: Execute complete focused N4 test suite (must not self-attest JHora)
        run: npm run test:n4
  synthetic-sign-parity:
    name: 50 synthetic profiles, 8000 independent PyJHora sign assignments
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONWARNINGS: ignore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual public JHora8 sample and document 44 convention differences
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 \
            'https://raw.githubusercontent.com/normalmystic/JHoraKit/f63826b501eabe69c6b08c5365875e1e2f74c24a/sample-data/Mahatma_Gandhi/chart.json' \
            -o /tmp/n4-real-jhora-public-sample.json
          node --experimental-strip-types tools/n4-jhora-public-sample.test.mjs /tmp/n4-real-jhora-public-sample.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned independent external calculator
        run: |
          python -m pip install --no-cache-dir PyJHora==4.8.7 pyswisseph PyQt6 numpy geocoder geopy pytz timezonefinder python-dateutil certifi
      - name: Assert importable independent PyJHora implementation
        run: |
          python -c "from jhora.horoscope.chart import charts; print('N4_PYJHORA_ORACLE_AVAILABLE')"
      - name: Compare 8000 placements — no guest data and no LLM
        run: node --experimental-strip-types tools/n4-pyjhora-compare.mjs
