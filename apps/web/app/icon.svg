<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
 <title id="title">Galaxiora — G cosmic monogram</title>
 <desc id="desc">A luminous gold orbital letter G and a small star on a round deep-indigo background</desc>
 <defs>
  <radialGradient id="space" cx="0.32" cy="0.26" r="0.9">
   <stop offset="0" stop-color="#28365F"/>
   <stop offset="0.6" stop-color="#141B38"/>
   <stop offset="1" stop-color="#090E22"/>
  </radialGradient>
  <linearGradient id="orbit" x1="0.08" y1="0.06" x2="0.91" y2="1">
   <stop offset="0" stop-color="#FFF2BC"/>
   <stop offset="0.45" stop-color="#FFD279"/>
   <stop offset="1" stop-color="#D68D3D"/>
  </linearGradient>
 </defs>
 <circle cx="32" cy="32" r="30" fill="url(#space)"/>
 <circle cx="32" cy="32" r="29" stroke="#C79D59" stroke-opacity="0.52" stroke-width="1.1" fill="none"/>
 <!-- The orbit itself is the G: one unmistakable thick stroke at small sizes. -->
 <path d="M44.5 19.5 C40.9 15.5 36.2 13.4 31.1 13.4 C20.2 13.4 13.8 21.8 13.8 32 C13.8 43.2 21.5 50.6 32.3 50.6 C41.2 50.6 47.6 45.6 47.6 37.8 L47.6 33.5 L35 33.5" fill="none" stroke="url(#orbit)" stroke-width="7.6" stroke-linecap="round" stroke-linejoin="round"/>
 <!-- The star touches the beginning of the orbital G instead of being a separate crescent. -->
 <path d="M47.2 11.7 48.5 15.1 51.9 16.4 48.5 17.8 47.2 21.2 45.8 17.8 42.4 16.4 45.8 15.1Z" fill="#FFF8DA"/>
 <circle cx="35.1" cy="33.5" r="1.1" fill="#FFF3C5"/>
</svg>
