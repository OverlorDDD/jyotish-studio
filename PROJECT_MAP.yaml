# Galaxiora canonical code/navigation map. Update with structural changes only.
schema_version: 1
updated: "2026-10-20"
verified_against:
  branch: main
  commit: "fcd356f63d5b66105460e4983ed3f68e05099d96"
product:
  brand: Galaxiora
  repo: "OverlorDDD/jyotish-studio"
  former_name: "Jyotish Studio"
  languages: [uk, en]
  architecture_decision: "docs/adr/0001-modular-monolith.md"
  target_design: "docs/architecture-target.md"
  current_shape: "Next.js + NestJS + Prisma/PostgreSQL + pure TS Jyotish core"
  strategy: "evolutionary modular monolith; no big-bang rewrite"
runtimes:
  full:
    frontend: "apps/web; Next.js App Router; 3000"
    backend: "apps/api; NestJS; 4000; binds 127.0.0.1"
    database: "Docker PostgreSQL; host 5433; Prisma migrations"
    proxy: "Next.js /api/* -> INTERNAL_API_ORIGIN -> NestJS /api/*"
    launch: "npm run dev:full"
  standalone:
    entry: "apps/api/src/standalone.ts"
    launch: "npm run dev"
    warning: "in-memory preview, not production or DB-equivalent"
modules:
  jyotish:
    status: "implemented; CI tested; independent JHora sign-off pending"
    domain: "packages/jyotish-core/src/index.ts; packages/jyotish-core/src/rules.ts"
    adapter: "apps/api/src/ephemeris.ts"
    application: "apps/api/src/logic.ts; apps/api/src/report.ts; apps/api/src/free-ai.ts; apps/api/src/jyotish-report-application.ts"
    shared_saved_charts: "apps/api/src/chart-application.ts; apps/api/src/chart-prisma.ts"
    http: "apps/api/src/nest.ts"
    web: "apps/web/app/[locale]/astrology/jyotish/page.tsx"
    notes: "Swiss Ephemeris, Lahiri, D1/D9/D10, Vimshottari; deterministic calculation/rule facts"
    writing_voice: "apps/api/src/jyotish-reader-style.ts; docs/jyotish-editorial-standard.md"
    reading_narrative: "apps/api/src/editorial-reading.ts v1.1 — chart-linked synthesis, no generic weekly homework"
  identity:
    status: "implemented; production hardening pending"
    http: "apps/api/src/account.ts"
    domain_policy: "apps/api/src/account-policy.ts"
    saved_charts: "apps/api/src/chart-application.ts"
    persistence_adapter: "apps/api/src/chart-prisma.ts"
    session: "apps/api/src/auth.ts"
    web: "apps/web/app/components/AccountPortal.tsx; apps/web/app/[locale]/account/page.tsx"
    invariants: "guest chart calculations do not persist; saved chart owner required"
  admin:
    status: "implemented; manual local admin setup required"
    http: "apps/api/src/admin.ts"
    role_use_case: "apps/api/src/admin-role-application.ts"
    role_adapter: "apps/api/src/admin-role-prisma.ts"
    web: "apps/web/app/components/AdminDashboard.tsx; apps/web/app/components/RoleManagement.tsx"
    bootstrap: "tools/setup-owner.mjs; npm run admin:setup"
    roles: [MEMBER, EXPERT, SUPPORT, ADMIN]
    entitlements: [FREE, PREMIUM]
  tarot:
    status: "v2 with A2 use-case extraction; branch CI passed, browser/provider/license QA pending"
    http: "apps/api/src/tarot.ts"
    use_cases: "apps/api/src/tarot-application.ts"
    domain_policy: "apps/api/src/tarot-domain.ts"
    ports: "apps/api/src/tarot-ports.ts"
    persistence_adapter: "apps/api/src/tarot-prisma-repository.ts"
    ai_adapter: "apps/api/src/tarot-ai-gateway.ts"
    draw: "apps/api/src/tarot-deck.ts"
    interpretation: "apps/api/src/tarot-reader.ts; apps/api/src/tarot-synthesis.ts; apps/api/src/tarot-depth.ts"
    ai: "apps/api/src/tarot-ai.ts"
    web: "apps/web/app/components/TarotStudio.tsx; apps/web/app/components/TarotCardArt.tsx"
    assets: "apps/web/lib/tarot-art.ts; tools/tarot-assets-prepare.mjs"
    note: "78 RWS illustrations prepared at start, not committed binary; see docs/tarot-v2.md"
    spreads: [one, three, celtic]
    readings_per_utc_day:
      normal: 3
      admin: 100
    successful_ai_per_utc_day:
      normal: 2
      admin: 10
    privacy: "authenticated draw, user-private history, explicit AI consent"
  experts:
    status: "A7 first phase: verified expert profiles, authenticated applications, admin approval/suspension and public directory; real payments not live"
    profile_policy: "apps/api/src/expert-policy.ts"
    http: "apps/api/src/experts.ts; apps/api/src/reading-orders.ts"
    web: "apps/web/app/components/ExpertMarketplace.tsx; apps/web/app/[locale]/experts/page.tsx; ExpertOffer.tsx"
    persistence: "ExpertProfile (review status, revision CAS, applicant consent); private ReadingDraft, ReadingOrder skeleton"
    invariant: "only VERIFIED profiles with active EXPERT role can appear publicly; private briefs not forwarded; no client-controlled PAID transition"
    next_gate: "choose licensed payment provider, verified signature webhooks, idempotent transaction, refunds, protected video storage"
    warning: "No checkout or real monetary operation; A7 payment and delivery completion explicitly blocked"
  yoga:
    status: "Yoga v2: four guided practices; box visual 4-4-4-4 and two no-hold alternatives; reflection untimed"
    content: "apps/web/lib/yoga-content.ts"
    hub: "apps/web/app/components/YogaHub.tsx"
    player: "apps/web/app/components/YogaSession.tsx; apps/web/app/components/YogaBreathSession.tsx"
    timing_domain: "apps/web/lib/breathing-patterns.ts (pure phases and cycle math)"
    detail: "apps/web/app/[locale]/yoga/[slug]/page.tsx"
    privacy: "session progress in React memory, no personal data or persistence"
  academy:
    status: "A5: seven original bilingual lessons in three topic hubs with quiz"
    content: "apps/web/lib/academy-content.ts"
    hub: "apps/web/app/components/AcademyHub.tsx"
    quiz: "apps/web/app/components/AcademyQuiz.tsx"
    detail: "apps/web/app/[locale]/learn/[slug]/page.tsx"
    privacy: "quiz answers in React memory, no account/DB"
  editorial:
    status: "A6 versioned CMS, additive migration, SUPPORT drafts and ADMIN approvals"
    policy: "apps/api/src/editorial-policy.ts"
    application: "apps/api/src/editorial-application.ts"
    repository: "apps/api/src/editorial-prisma.ts"
    controller: "apps/api/src/editorial.ts"
    tables: [EditorialEntry, EditorialVersion]
    user_interface: "apps/web/app/components/EditorialWorkspace.tsx"
    public: "apps/web/lib/editorial-public.ts; EditorialPublishedCards.tsx; EditorialArticle.tsx"
    invariant: "only PUBLISHED visible to public; immutable versions; CAS expectedRevision; A5 slugs reserved"
  portal:
    status: "implemented bilingual shell; Yoga and Academy live; News and Community placeholders"
    web: "apps/web/app/components/PortalHome.tsx; apps/web/app/components/PortalSection.tsx; apps/web/app/components/PortalShell.tsx"
    brand: "apps/web/lib/brand.ts"
    future: [western_astrology, panchang, news, community, mobile]
  ai_usage:
    status: "usage storage implemented; distributed budgets/throttles pending"
    http: "apps/api/src/ai.ts; apps/api/src/free-ai.ts; apps/api/src/tarot-ai.ts"
    table: AiUsage
persistence:
  schema: "apps/api/prisma/schema.prisma"
  migrations: "apps/api/prisma/migrations/"
  entities: [User, Chart, Interpretation, ReadingOrder, AiUsage, ReadingDraft, RoleChange, TarotReading, EditorialEntry, EditorialVersion, ExpertProfile]
