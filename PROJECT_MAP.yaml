    charts: "/api/v1/charts/*"
    reports: "/api/v1/reports"
    interpretations: "/api/v1/interpretations"
    accounts: "/api/v1/account/*"
    tarot: "/api/v1/tarot/*"
    admin: "/api/v1/admin/*"
    editorial: "/api/v1/editorial/entries/*"
    content_public: "/api/v1/content/*"
    drafts: "/api/v1/reading-orders/drafts"
    expert_profiles: "/api/v1/experts/*"
    order_tracker: "/api/v1/reading-orders/my-orders"
